      "paths": [
        "usr/local/bin/gosu"
      ],
      "statement": "Go stdlib compiled into usr/local/bin/gosu. gosu runs only in the postgres entrypoint to drop root before starting the server. It reads no untrusted input, opens no socket, and exits before PostgreSQL accepts connections. PostgreSQL itself is never published outside the Docker network in either Compose configuration. gosu is not an apk package, so an apk upgrade layer would not replace it: with the official image used as is, only an upstream rebuild clears these. Re-triage on expiry: see security/trivy/README.md.",
      "expired_at": "2026-11-24T00:00:00Z"
