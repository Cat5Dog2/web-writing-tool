{
  "vulnerabilities": [
    {
      "id": "CVE-2026-14456",
      "purls": [
        "pkg:apk/alpine/libcrypto3@3.5.7-r0",
        "pkg:apk/alpine/libssl3@3.5.7-r0"
      ],
      "statement": "OpenSSL QUIC server listener only. The unbounded queue is in the listener object that OpenSSL 3.5 added for inbound QUIC INITIAL packets, and an application reaches it only by creating that listener. PostgreSQL 16 has no QUIC support: it terminates TLS over TCP through the classic SSL_accept path, and this deployment leaves ssl off and never publishes port 5432, so PostgreSQL is reachable only from the app container on the Docker network. Alpine ships the fix as 3.5.8-r0, so with the official image used as is, the finding clears once upstream rebuilds on it. The purls are pinned to 3.5.7-r0 so any other version re-opens the gate. Re-triage on expiry: see security/trivy/README.md.",
      "expired_at": "2026-10-27T00:00:00Z"
    },
    {
      "id": "CVE-2025-61726",
      "paths": [
        "usr/local/bin/gosu"
      ],
      "statement": "Go stdlib compiled into usr/local/bin/gosu. gosu runs only in the postgres entrypoint to drop root before starting the server. It reads no untrusted input, opens no socket, and exits before PostgreSQL accepts connections. PostgreSQL itself is never published outside the Docker network in either Compose configuration. gosu is not an apk package, so an apk upgrade layer would not replace it: with the official image used as is, only an upstream rebuild clears these. Re-triage on expiry: see security/trivy/README.md.",
      "expired_at": "2026-11-24T00:00:00Z"
    },
