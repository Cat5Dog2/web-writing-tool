name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and non-browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Check .NET SDK container
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/dotnet.ps1 --info

      - name: Format check
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/format.ps1

      - name: Slopwatch
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/dotnet.ps1 tool restore
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/dotnet.ps1 slopwatch analyze -d . --fail-on warning

      - name: NuGet vulnerability scan
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/scan-nuget.ps1

      # A non-ASCII byte or a BOM in a script changes how Windows PowerShell parses it, silently.
      # docs/coding-guidelines.md 19.1 has the details.
      - name: Script encoding check
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-script-encoding.ps1

      # Validates security/trivy and proves the validator still rejects malformed acceptances.
      # Runs here, without Docker, so a bad acceptance fails before the production Docker job.
      - name: Validate vulnerability acceptances
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/scan-image.ps1 -ValidateOnly -SelfTest

      - name: Test production Compose safeguards
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test-production-compose.ps1

      - name: Build
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1

      - name: Test
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1

  # CI and the VPS run pwsh, local procedures in docs run "powershell" (Windows PowerShell 5.1).
  # The two hosts parse scripts differently, so the checks that guard the release gate are run on
  # both. Needs no Docker: -ValidateOnly stops before the image scan.
  script-compat:
    name: Windows PowerShell compatibility
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Report host version
        run: $PSVersionTable.PSVersion.ToString()

      - name: Script encoding check
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-script-encoding.ps1

      - name: Validate vulnerability acceptances
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/scan-image.ps1 -ValidateOnly -SelfTest

      - name: Test production Compose safeguards
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-production-compose.ps1

  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      # scripts/test-e2e.ps1 owns the restore / build / Chromium install / test sequence
      # so CI and local runs cannot drift apart.
      - name: Run E2E smoke
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test-e2e.ps1

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts
          path: test-results/e2e
          if-no-files-found: ignore

  performance:
    name: Nightly performance
    runs-on: ubuntu-latest
    needs: build-test
    # docs/ci-cd-design.md 7章。夜間CIの劣化検知が目的で、リリース停止条件ではない。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Run performance tests
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test-performance.ps1

  migration-image-gate:
    name: Migration image gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      # Production Docker smoke is intentionally too expensive for every PR. This focused job still
      # exercises the profiled service selection, pinned SDK image, acceptance file and receipt on
      # the event where those changes are reviewed.
      - name: Scan the migration image and issue a receipt
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/scan-image.ps1
          -ComposeProfile tools -ServiceName migrate
          -ScanReceiptOutputPath artifacts/scanned-migrate.json

      - name: Verify the migration scan receipt
        run: |
          test "$(jq -r .gateResult artifacts/scanned-migrate.json)" = "passed"
          test "$(jq -r .schemaVersion artifacts/scanned-migrate.json)" = "1"
          test -n "$(jq -r .scannerVersion artifacts/scanned-migrate.json)"
          test -n "$(jq -r .vulnerabilityDatabaseUpdatedAt artifacts/scanned-migrate.json)"
          reference=$(jq -r '.services.migrate.reference' artifacts/scanned-migrate.json)
          recorded=$(jq -r '.services.migrate.imageId' artifacts/scanned-migrate.json)
          actual=$(docker image inspect --format '{{.Id}}' "$reference")
          echo "migrate: reference=$reference recorded=$recorded actual=$actual"
          test "$recorded" = "$actual"

  docker-production:
    name: Production Docker smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    env:
      ASPNETCORE_ENVIRONMENT: Production
      APP_IMAGE: web-writing-tool-app:ci
      CADDY_IMAGE: web-writing-tool-caddy:ci
      App__BaseUrl: http://localhost:8080
      CADDY_SITE_ADDRESS: :80
      CADDY_HTTP_PORT: 8080
      CADDY_HTTPS_PORT: 8443
      POSTGRES_DB: web_writing_tool
      POSTGRES_USER: web_writing_tool
      POSTGRES_PASSWORD: ci-postgres-password
      Security__RequireHttps: "false"
      Security__AllowedForwardedHosts__0: localhost
      AdminSeed__Email: admin@example.test
      AdminSeed__Password: Change-this-CI-password-123!
      AiProviders__Gemini__ApiKey: ci-placeholder
      SearchProviders__Tavily__ApiKey: ci-placeholder
      SearchProviders__X__BearerToken: ci-placeholder
      SearchCache__Policy: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      # --pull is required. A cached base image keeps shipping runtime patches that upstream
      # already fixed, and the image scan below would then fail on avoidable vulnerabilities.
      # caddy is built from Dockerfile.caddy, see docs/ci-cd-design.md 9.1.
      - name: Build production images
        run: docker compose build --pull app caddy

      # Scans every image docker-compose.yml deploys: app, caddy and postgres.
      # -ProvenanceOutputPath records what was scanned, so the start step below can use those exact
      # image IDs instead of resolving the tags again.
      - name: Image vulnerability scan
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/scan-image.ps1 -AppImage web-writing-tool-app:ci -ProvenanceOutputPath artifacts/scanned-images.json

      # The start step trusts the manifest, so this checks it names the artifacts that were really
      # built rather than whatever the tags point at now.
      - name: The manifest names the images that were scanned
        run: |
          cat artifacts/scanned-images.json
          test "$(jq -r .gateResult artifacts/scanned-images.json)" = "passed"
          test "$(jq -r .schemaVersion artifacts/scanned-images.json)" = "1"
          for service in app postgres caddy; do
            recorded=$(jq -r --arg s "$service" '.services[$s].imageId' artifacts/scanned-images.json)
            reference=$(jq -r --arg s "$service" '.services[$s].reference' artifacts/scanned-images.json)
            actual=$(docker image inspect --format '{{.Id}}' "$reference")
            echo "$service: reference=$reference recorded=$recorded actual=$actual"
            test "$recorded" = "$actual"
          done

      # migrate is behind the tools profile, so the scan above does not see it, yet it is the only
      # service that writes to the production database. Gated in its own run rather than by
      # widening that one: its image is a digest in the Compose file with no variable to pin, so
      # adding it to the manifest would only make the manifest disagree with the wrapper's scope.
      # -ServiceName keeps this to the one image the deployment scan did not already cover.
      - name: Migration image vulnerability scan
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/scan-image.ps1
          -ComposeProfile tools -ServiceName migrate
          -ScanReceiptOutputPath artifacts/scanned-migrate.json

      # The pin is the reason the scan above means anything. A tag here would let an unreviewed
      # image write to the production database on the next deployment.
      - name: The migration image is pinned by digest
        run: |
          image=$(docker compose --profile tools config --format json | jq -r '.services.migrate.image')
          recorded_reference=$(jq -r '.services.migrate.reference' artifacts/scanned-migrate.json)
          recorded_id=$(jq -r '.services.migrate.imageId' artifacts/scanned-migrate.json)
          actual_id=$(docker image inspect --format '{{.Id}}' "$image")
          echo "migrate image: reference=$image recorded=$recorded_id actual=$actual_id"
          echo "$image" | grep -qE '@sha256:[0-9a-f]{64}$'
          test "$recorded_reference" = "$image"
          test "$recorded_id" = "$actual_id"

      # Needs a daemon, which is why it is a separate switch from the -SelfTest run in the
      # validation job. It covers the two properties the argument assertions cannot reach: that
      # Trivy really stops on a Java archive with no index cached, which is the only reason Java is
      # out of scope, and that the cache check really refuses a volume a scan has written to. Both
      # were established by hand during review; this is what keeps them true when the pinned
      # scanner version moves. Placed after the scan so the database is already in the cache.
      - name: Scanner Docker self test
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/scan-image.ps1 -DockerSelfTest

      # Every compose call that resolves or starts an image after the scan goes through the wrapper.
      # Mixing the two would leave some calls resolving postgres through its tag and others through
      # the pinned ID, and Compose recreates a running container when its resolved image changes.
      - name: Start PostgreSQL
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/production-compose.ps1 \
            -ComposeFile docker-compose.yml \
            -ComposeCommand 'up -d postgres'

      # Use the same tools profile the deployment procedure uses, so the documented
      # migration path is exercised by CI instead of a CI-only variant.
      - name: Apply migrations
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/production-compose.ps1 \
            -ComposeFile docker-compose.yml \
            -ComposeCommand '--profile tools run --rm migrate'

      # --no-build so the smoke test runs the exact image the scan above inspected. Rebuilding here
      # would produce a different artifact than the one that passed the gate.
      #
      # Started through the wrapper, so the smoke test exercises the deployment path rather than
      # only proving the images exist. The three image variables are deliberately set to tags that
      # do not exist: Compose lets the shell environment win over --env-file, so if the wrapper did
      # not overwrite them from the manifest this step could not find an image at all. On a
      # deployment host the same mistake is silent, because there the exported tag usually does
      # resolve, just to something the gate never saw.
      - name: Start production compose from the manifest
        env:
          APP_IMAGE: web-writing-tool-app:not-scanned
          POSTGRES_IMAGE: postgres:not-scanned
          CADDY_IMAGE: web-writing-tool-caddy:not-scanned
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/production-compose.ps1 \
            -ComposeFile docker-compose.yml \
            -ComposeCommand 'up -d --no-build app caddy'

      - name: Check health through Caddy
        run: |
          curl -fsS --retry 20 --retry-all-errors --retry-delay 3 http://localhost:8080/health/live
          curl -fsS --retry 20 --retry-all-errors --retry-delay 3 http://localhost:8080/health/ready

      # Caddy must answer 404 for /health/ready outside private ranges. Docker publishes ports
      # from the bridge gateway, so a host curl always looks private. Attaching Caddy to a
      # TEST-NET-3 network gives a genuinely non-private source address.
      - name: Check /health/ready is blocked from a public source address
        run: |
          caddy=$(docker compose ps -q caddy)
          docker network create --subnet 203.0.113.0/24 ci-public-probe
          docker network connect --alias caddy-public ci-public-probe "$caddy"
          ready=$(docker run --rm --network ci-public-probe curlimages/curl:8.21.0 -s -o /dev/null -w '%{http_code}' http://caddy-public/health/ready)
          live=$(docker run --rm --network ci-public-probe curlimages/curl:8.21.0 -s -o /dev/null -w '%{http_code}' http://caddy-public/health/live)
          echo "public source: /health/ready=$ready /health/live=$live"
          test "$ready" = "404"
          test "$live" = "200"

      - name: Remove public probe network
        if: always()
        run: |
          caddy=$(docker compose ps -q caddy || true)
          if [ -n "$caddy" ]; then docker network disconnect ci-public-probe "$caddy" || true; fi
          docker network rm ci-public-probe || true

      - name: Show compose status on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200 app
          docker compose logs --tail=200 caddy
          docker compose logs --tail=200 postgres

      - name: Cleanup
        if: always()
        run: docker compose down -v

  external-caddy:
    name: External Caddy topology
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Every docker compose call in this job picks both files up, so no step can accidentally
      # exercise the base topology instead of the external-Caddy one.
      COMPOSE_FILE: docker-compose.yml:docker-compose.external-caddy.yml
      COMPOSE_PROJECT_NAME: web-writing-tool
      CADDY_NETWORK: ci-external-caddy
      ASPNETCORE_ENVIRONMENT: Production
      APP_IMAGE: web-writing-tool-app:ci-external-caddy
      App__BaseUrl: http://localhost:8081
      APP_HOST_PORT: 8081
      POSTGRES_DB: web_writing_tool
      POSTGRES_USER: web_writing_tool
      POSTGRES_PASSWORD: ci-postgres-password
      Security__RequireHttps: "false"
      Security__AllowedForwardedHosts__0: localhost
      AdminSeed__Email: admin@example.test
      AdminSeed__Password: Change-this-CI-password-123!
      AiProviders__Gemini__ApiKey: ci-placeholder
      SearchProviders__Tavily__ApiKey: ci-placeholder
      SearchProviders__X__BearerToken: ci-placeholder
      SearchCache__Policy: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preflight refuses an explicit missing environment file
        run: |
          set +e
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/preflight-external-caddy.ps1 \
            -EnvFile .ci-env-does-not-exist > preflight-missing-env.log 2>&1
          status=$?
          set -e
          cat preflight-missing-env.log
          test "$status" -ne 0
          grep -q "Environment file was not found" preflight-missing-env.log

      # The whole reason the preflight exists. Compose validates an external network only at "up",
      # which on a deployment host lands after the build, the app stop, the backup and the
      # migration. This asserts the preflight refuses while nothing has been changed yet.
      - name: Preflight refuses when the external network is missing
        run: |
          set +e
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/preflight-external-caddy.ps1 > preflight-missing.log 2>&1
          status=$?
          set -e
          cat preflight-missing.log
          test "$status" -ne 0
          grep -q "does not exist" preflight-missing.log

      # Confirms the gap the preflight closes is real, rather than the preflight guarding against
      # something Compose already rejects on its own.
      - name: Compose config alone does not catch the missing network
        run: docker compose config --quiet

      - name: Create the external network
        run: docker network create "$CADDY_NETWORK"

      - name: Preflight passes once the network exists
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/preflight-external-caddy.ps1

      - name: Build the app image
        run: docker compose build --pull app

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Apply migrations
        run: docker compose --profile tools run --rm migrate

      - name: Start app
        run: docker compose up -d --no-build --wait app

      - name: The bundled Caddy stays out of scope
        run: |
          docker compose config --services | sort > services.actual
          printf 'app\npostgres\n' > services.expected
          diff services.expected services.actual
          test -z "$(docker compose ps -q caddy || true)"

      # A shared Caddy resolves the app by alias, so the alias is what has to work, not the
      # service name.
      - name: A container on the Caddy network reaches the app by its alias
        run: |
          code=$(docker run --rm --network "$CADDY_NETWORK" curlimages/curl:8.21.0 \
            -s -o /dev/null -w '%{http_code}' --retry 10 --retry-all-errors --retry-delay 3 \
            http://wwt-app:8080/health/live)
          echo "wwt-app:8080/health/live = $code"
          test "$code" = "200"

      - name: PostgreSQL is not attached to the Caddy network
        run: |
          attached=$(docker network inspect "$CADDY_NETWORK" --format '{{range .Containers}}{{.Name}} {{end}}')
          echo "attached: $attached"
          echo "$attached" | grep -q -- "-app-"
          if echo "$attached" | grep -q -- "-postgres-"; then
            echo "postgres is attached to the Caddy network" >&2
            exit 1
          fi

      # Name resolution failing is not proof of isolation, because the address could still be
      # routable. curl exits 7 or 28 when the TCP connection never completes, and 52 or 56 when it
      # completes and the reply is not HTTP, which is what a reachable PostgreSQL would produce.
      - name: PostgreSQL is unreachable from the Caddy network by address
        run: |
          postgres=$(docker compose ps -q postgres)
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$postgres" | awk '{print $1}')
          echo "postgres ip: $ip"
          test -n "$ip"
          set +e
          docker run --rm --network "$CADDY_NETWORK" curlimages/curl:8.21.0 \
            -s -o /dev/null --connect-timeout 5 "http://$ip:5432"
          status=$?
          set -e
          echo "curl exit: $status"
          case "$status" in
            7|28) echo "connection refused or timed out, as expected" ;;
            *) echo "unexpected curl exit $status, the TCP connection may have succeeded" >&2; exit 1 ;;
          esac

      # Matching on the port number alone would fail on an unpublished container: docker ps prints
      # "5432/tcp" for a merely exposed port. A host mapping is what "->" marks, as in
      # "127.0.0.1:5433->5432/tcp", so that is what this looks for.
      - name: PostgreSQL is not published to the host
        run: |
          published=$(docker ps --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" --filter "name=postgres" --format '{{.Names}} {{.Ports}}')
          echo "$published"
          test -n "$published"
          if echo "$published" | grep -q -- '->'; then
            echo "postgres publishes a host port" >&2
            exit 1
          fi

      - name: The app is published on loopback only
        run: |
          curl -fsS http://127.0.0.1:8081/health/live
          ports=$(docker ps --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" --format '{{.Ports}}')
          echo "app ports: $ports"
          echo "$ports" | grep -q '127.0.0.1:8081'
          if echo "$ports" | grep -qE '0\.0\.0\.0:8081|\[::\]:8081'; then
            echo "app is published beyond loopback" >&2
            exit 1
          fi

      - name: Show compose status on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200 app
          docker compose logs --tail=200 postgres
          docker network inspect "$CADDY_NETWORK" || true

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v || true
          docker network rm "$CADDY_NETWORK" || true
